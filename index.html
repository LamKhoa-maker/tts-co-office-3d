<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#eef4fb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>TTS.Co · Mô hình văn phòng 3D</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230f172a'/%3E%3Ctext x='32' y='42' font-family='Segoe UI,sans-serif' font-size='26' font-weight='700' fill='%23e11d48' text-anchor='middle'%3ETTS%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <canvas id="scene" aria-label="Mô hình văn phòng 3D của TTS.Co"></canvas>

  <div id="ui">
    <header class="brand glass">
      <div class="brand-mark">TTS</div>
      <div class="brand-text">
        <h1>TTS.Co <span>· Mô hình văn phòng 3D</span></h1>
        <p>5 phòng ban · <span id="staffCount">7</span> nhân sự · Quy trình khép kín</p>
      </div>
    </header>

    <div class="topbar glass">
      <div class="status" id="statusChip" data-state="idle">
        <span class="dot"></span>
        <span id="statusText">Sẵn sàng</span>
      </div>
      <button id="btnRun" class="btn primary" type="button">
        <span class="ico">▶</span><span class="label">Chạy quy trình</span>
      </button>
      <button id="btnSpeed" class="btn mono" type="button" title="Tốc độ mô phỏng">1×</button>
      <button id="btnLock" class="btn square" type="button" title="Khoá góc nhìn ban đầu · vẫn thu phóng được" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2.2" /><path d="M8.2 10V7.4a3.8 3.8 0 0 1 7.6 0V10" /></svg>
      </button>
      <button id="btnRotate" class="btn square" type="button" title="Xoay tự động">⟳</button>
      <button id="btnReset" class="btn square" type="button" title="Về góc nhìn mặc định">⌂</button>
      <button id="btnDash" class="btn dash-btn" type="button" aria-controls="boardPanel" aria-expanded="false" title="Dashboard điều hành">
        <span class="ico">▤</span><span class="label">Điều hành</span>
      </button>
    </div>

    <aside id="deptCard" class="panel glass hidden" aria-live="polite"></aside>

    <aside class="panel glass board-panel" id="boardPanel">
      <div class="panel-head">
        <h2 class="sr-only">Bảng tin hàng ngày</h2>
        <div class="panel-tabs" role="tablist" aria-label="Bảng tin và điều hành">
          <button id="tabBoard" class="panel-tab" type="button" role="tab" aria-selected="true" aria-controls="boardView"><span class="live-dot"></span>Bảng tin</button>
          <button id="tabDash" class="panel-tab" type="button" role="tab" aria-selected="false" aria-controls="dashView">▤ Điều hành</button>
        </div>
        <span class="board-date" id="boardDate"></span>
        <button id="panelClose" class="panel-close" type="button" aria-label="Đóng bảng điều hành">×</button>
      </div>
      <div class="panel-view" id="boardView" role="tabpanel" aria-labelledby="tabBoard">
        <ul class="board-list" id="boardList"></ul>
      </div>
      <div class="panel-view hidden" id="dashView" role="tabpanel" aria-labelledby="tabDash">
        <div class="dash-top"><span id="dashAsOf">Dữ liệu mẫu</span><span class="dash-sample">Dữ liệu mẫu</span></div>
        <div class="dash-scroll" id="dashBody"></div>
      </div>
    </aside>

    <div class="flow glass">
      <span class="flow-label">Quy trình</span>
      <div class="flow-steps" id="flowSteps"></div>
    </div>

    <div id="bubble" class="bubble hidden"></div>
    <div id="toast" class="toast hidden"></div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
